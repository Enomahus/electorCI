services:
  00-web:
    container_name: electorCI.backend
    image: ${DOCKER_REGISTRY-}00web
    build:
      context: .
      dockerfile: src/Backend/00-Web/Dockerfile
      args:
        - CONFIGURATION=${CONFIGURATION:-Debug}
    env_file:
      - "variables.dev.env"
    ports:
      - "44200:44200"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      - ~/.vsdbg:/remote_debugger:rw
    depends_on:
      electorCI.database.init:
        condition: service_completed_successfully
      electorCI.jaeger:
        condition: service_started
  
  electorCI.jaeger:
    container_name: electorCI.jaeger
    image: jaegertracing/all-in-one:1.58
    environment:
      - METRICS_STORAGE_TYPE=prometheus
      - PROMETHEUS_SERVER_URL=http://electorCI.backend:41200
      - PROMETHEUS_QUERY_SUPPORT_SPANMETRICS_CONNECTOR=${PROMETHEUS_QUERY_SUPPORT_SPANMETRICS_CONNECTOR:-true}
      - PROMETHEUS_QUERY_NAMESPACE=${PROMETHEUS_QUERY_NAMESPACE:-}
      - PROMETHEUS_QUERY_DURATION_UNIT=${PROMETHEUS_QUERY_DURATION_UNIT:-}
      - PROMETHEUS_QUERY_NORMALIZE_CALLS=true
      - PROMETHEUS_QUERY_NORMALIZE_DURATION=true
    ports:
      - "16686:16686"
      - "14268:14268"

  electorCI.prometheus:
    container_name: electorCI.prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "41200:9090"

  electorCI.database:
    container_name: electorCI.database
    image: 'mcr.microsoft.com/mssql/server:2025-CU2-ubuntu-22.04'
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Inay@h225
      - MSSQL_PID=Developer
    ports:
      - "43200:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -No -S localhost -U sa -P Inay@h225 -d master -Q "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 10

  electorCI.database.init:
    container_name: electorCI.database.init
    image: 'mcr.microsoft.com/mssql/server:2025-CU2-ubuntu-22.04'
    volumes:
      - ../dbinit:/docker-entrypoint-initdb.d:ro
    depends_on:
      electorCI.database:
        condition: service_healthy
    command: >
      bash -c "
        /opt/mssql-tools18/bin/sqlcmd -No -S electorCI.database -U sa -P Inay@h225 -d master -i /docker-entrypoint-initdb.d/init.sql; 
        echo 'All done!';"