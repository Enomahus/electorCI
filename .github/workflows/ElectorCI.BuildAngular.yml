name: ElectorCI - Build Angular

on:
  pull_request:
    types: [closed]
    branches: [develop, qa, master]
    paths:
      - "src/front/web-client/**"
      - ".github/workflows/ElectorCI.BuildAngular.yml"

defaults:
  run:
    working-directory: src/front/web-client

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: src/front/web-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Create archive
        run: |
          mkdir -p artifacts
          cd dist/web-client/browser
          zip -r ../../../artifacts/web-client-${{ github.event.pull_request.base.ref }}-${{ github.sha }}.zip .

      - name: Publish archive
        uses: actions/upload-artifact@v4
        with:
          name: web-client-${{ github.event.pull_request.base.ref }}-${{ github.sha }}
          path: src/front/web-client/artifacts/*.zip
          retention-days: 30
