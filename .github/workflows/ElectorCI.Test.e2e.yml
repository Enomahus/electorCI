name: ElectorCI - Tests E2E

on:
  pull_request:
    types: [opened, closed]
    branches: [develop, qa, master]
    paths:
      - "src/back/**"
      - "src/dbinit/**"
      - "src/front/web-client/**"
      - "src/front/e2e/**"
      - ".github/workflows/ElectorCI.Test.e2e.yml"
  workflow_dispatch:

env:
  # Infrastructure only: everything else comes from src/back/variables.dev.env
  DB_PORT: "43200"
  API_PORT: "44200"

jobs:
  e2e:
    name: Playwright (desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'opened' ||
      github.event.pull_request.merged == true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Application configuration --------------------------------------
      # variables.dev.env is the single source of truth for the backend
      # configuration. Values are exported to the job environment, secret-like
      # ones are registered with ::add-mask:: so they never surface in the logs,
      # and repository secrets (when defined) take precedence over the file.
      - name: Load application environment
        working-directory: src/back
        env:
          E2E_SA_PASSWORD: ${{ secrets.E2E_SA_PASSWORD }}
          E2E_JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
        run: |
          SECRET_KEYS=" JwtConfig__Secret DataConfig__DefaultUserPassword SmtpConfig__Password GoogleAuth__ClientSecret MicrosoftAuth__ClientSecret "
          APP_DB=""
          APP_URL=""

          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            case "$line" in ''|'#'*) continue ;; esac
            case "$line" in *=*) ;; *) continue ;; esac

            key="${line%%=*}"
            value="${line#*=}"
            case "$value" in '"'*'"') value="${value#\"}"; value="${value%\"}" ;; esac

            case "$SECRET_KEYS" in
              *" $key "*)
                if [ -n "$value" ]; then echo "::add-mask::$value"; fi
                ;;
            esac

            if [ "$key" = "ConnectionStrings__AppDb" ]; then APP_DB="$value"; fi
            if [ "$key" = "AppConfig__AppUrl" ]; then APP_URL="$value"; fi

            echo "$key=$value" >> "$GITHUB_ENV"
          done < variables.dev.env

          # The SA password lives inside the connection string: extract and mask it
          # so it is redacted everywhere it appears, including in the docker steps.
          SA_PASSWORD=$(printf '%s' "$APP_DB" | sed -n 's/.*Password=\([^;]*\).*/\1/p')
          SA_PASSWORD="${E2E_SA_PASSWORD:-$SA_PASSWORD}"
          if [ -z "$SA_PASSWORD" ]; then
            echo "Unable to resolve the SA password from variables.dev.env."
            exit 1
          fi
          echo "::add-mask::$SA_PASSWORD"
          echo "SA_PASSWORD=$SA_PASSWORD" >> "$GITHUB_ENV"

          if [ -n "$E2E_JWT_SECRET" ]; then
            echo "JwtConfig__Secret=$E2E_JWT_SECRET" >> "$GITHUB_ENV"
          fi

          # CI overrides: the compose hostnames (electorCI.database,
          # electorCI.otel_collector) do not exist on the runner.
          echo "ConnectionStrings__AppDb=Server=localhost,${DB_PORT};Database=ElectorDb;Connection Lifetime=30;User ID=sa;Password=${SA_PASSWORD};Encrypt=False;TrustServerCertificate=True" >> "$GITHUB_ENV"
          echo "Metric__Enable=false" >> "$GITHUB_ENV"
          echo "ASPNETCORE_HTTP_PORTS=${API_PORT}" >> "$GITHUB_ENV"

          # Test endpoints, derived from the same file.
          FRONT_PORT="${APP_URL##*:}"
          echo "BASE_URL=${APP_URL}" >> "$GITHUB_ENV"
          echo "FRONT_PORT=${FRONT_PORT}" >> "$GITHUB_ENV"
          echo "API_URL=http://localhost:${API_PORT}" >> "$GITHUB_ENV"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            src/front/web-client/package-lock.json
            src/front/e2e/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/back/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # --- Database ------------------------------------------------------
      - name: Start SQL Server
        run: |
          docker run -d --name electorci-database \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            -e MSSQL_PID=Developer \
            -p "${DB_PORT}:1433" \
            mcr.microsoft.com/mssql/server:2025-CU2-ubuntu-22.04

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            if docker exec electorci-database /opt/mssql-tools18/bin/sqlcmd \
                 -No -S localhost -U sa -P "$SA_PASSWORD" -d master -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready."
              exit 0
            fi
            sleep 5
          done
          echo "SQL Server did not become ready in time."
          docker logs electorci-database
          exit 1

      - name: Create database
        run: |
          docker cp src/dbinit/init.sql electorci-database:/tmp/init.sql
          docker exec electorci-database /opt/mssql-tools18/bin/sqlcmd \
            -No -S localhost -U sa -P "$SA_PASSWORD" -d master -i /tmp/init.sql

      # --- Backend -------------------------------------------------------
      - name: Build backend
        working-directory: src/back
        run: |
          dotnet restore ElectorCI.slnx
          dotnet build ElectorCI.slnx --no-restore --configuration Release

      - name: Start backend
        working-directory: src/back
        run: |
          nohup dotnet run \
            --project src/Backend/00-Web/00-Web.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "${API_URL}/info/version" > /dev/null 2>&1; then
              echo "Backend is ready."
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become ready in time."
          cat src/back/backend.log
          exit 1

      # --- Frontend ------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: src/front/web-client
        run: npm ci

      - name: Build frontend
        working-directory: src/front/web-client
        run: npx ng build --configuration production

      - name: Serve frontend
        working-directory: src/front/web-client
        run: |
          nohup npx --yes serve -s dist/web-client/browser -l "$FRONT_PORT" > frontend.log 2>&1 &
          echo $! > frontend.pid
          for i in $(seq 1 30); do
            if curl -fsS "$BASE_URL" > /dev/null 2>&1; then
              echo "Frontend is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready in time."
          cat frontend.log
          exit 1

      # --- Tests ---------------------------------------------------------
      - name: Install e2e dependencies
        working-directory: src/front/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/front/e2e
        run: npx playwright install --with-deps chromium

      # BASE_URL and API_URL are already exported by "Load application environment".
      - name: Run Playwright tests
        working-directory: src/front/e2e
        run: npx playwright test

      # --- Reports & cleanup ---------------------------------------------
      - name: Publish Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/front/e2e/playwright-report/**
            src/front/e2e/test-results/**
          retention-days: 7

      - name: Publish server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            src/back/backend.log
            src/front/web-client/frontend.log
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          [ -f src/back/backend.pid ] && kill "$(cat src/back/backend.pid)" || true
          [ -f src/front/web-client/frontend.pid ] && kill "$(cat src/front/web-client/frontend.pid)" || true
          docker rm -f electorci-database || true
